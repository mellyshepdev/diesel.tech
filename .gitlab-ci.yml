# The Docker image that will be used to build your app
image: node:22

stages:
  - build
  - test
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - when: always

variables:
  SECRET_DETECTION_ENABLED: 'true'
  npm_config_cache: $CI_PROJECT_DIR/.npm

frontend:
  stage: build
  interruptible: true
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week
  cache:
    key: npm-frontend
    paths:
      - .npm

backend:
  stage: build
  interruptible: true
  script:
    - cd backend
    - npm ci --prefer-offline --omit=dev
    - find src -name '*.js' -exec node --check {} +
  cache:
    key: npm-backend
    paths:
      - .npm

# Builds the 3D engine viewer and exposes it on GitLab Pages
create-pages:
  stage: deploy
  interruptible: true
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: public
  script:
    - cd engine-viewer
    - npm ci --prefer-offline
    - npx tsc --noEmit
    - npm run build
    - cd ..
    - mkdir -p public
    - cp -r engine-viewer/dist/. public/
  artifacts:
    paths:
      - public
  cache:
    key: npm-engine-viewer
    paths:
      - .npm
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

secret_detection:
  stage: test

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
